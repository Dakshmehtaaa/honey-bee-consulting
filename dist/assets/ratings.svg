<g transform="translate(112 262) rotate(-64) scale(0.9)"><g class="pa-leaf"><path d="M0 0C-15-20-14-50 0-72C14-50 15-20 0 0Z" fill="url(#a-leaf)"/><path d="M0-6V-56" stroke="#fffdf5" stroke-opacity=".38" stroke-width="2" stroke-linecap="round" fill="none"/></g></g>
<g transform="translate(112 178) rotate(-12) scale(0.8)"><g class="pa-leaf"><path d="M0 0C-15-20-14-50 0-72C14-50 15-20 0 0Z" fill="url(#a-leaf)"/><path d="M0-6V-56" stroke="#fffdf5" stroke-opacity=".38" stroke-width="2" stroke-linecap="round" fill="none"/></g></g>
