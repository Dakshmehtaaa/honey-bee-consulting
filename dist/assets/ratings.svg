<svg class="studio-pillar-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><defs>
<linearGradient id="a-paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:#fffdf6"/><stop offset="1" style="stop-color:#f8efd7"/></linearGradient>
<linearGradient id="a-paper2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:#f8efd7"/><stop offset="1" style="stop-color:#eadcaf"/></linearGradient>
<linearGradient id="a-mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#ecd277"/><stop offset="1" style="stop-color:#c6aa57"/></linearGradient>
<linearGradient id="a-deep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#667653"/><stop offset="1" style="stop-color:#2a3c27"/></linearGradient>
<linearGradient id="a-leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:#869960"/><stop offset="1" style="stop-color:#4c663c"/></linearGradient>
<linearGradient id="a-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:#f6db7b"/><stop offset="1" style="stop-color:#d0a12c"/></linearGradient>
<linearGradient id="a-curl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:#e6d49e"/><stop offset="1" style="stop-color:#caba84"/></linearGradient>
<radialGradient id="a-sphere" cx=".35" cy=".3" r=".8"><stop offset="0" style="stop-color:#c6d2a9"/><stop offset="1" style="stop-color:#73835c"/></radialGradient>
<filter id="a-sh" x="-25%" y="-20%" width="150%" height="160%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="7" stdDeviation="7" style="flood-color:rgba(64,54,25,.2);flood-opacity:1"/></filter>
<filter id="a-sh2" x="-30%" y="-30%" width="160%" height="180%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="3" stdDeviation="3" style="flood-color:rgba(64,54,25,.2);flood-opacity:1"/></filter>
<filter id="a-em" x="-10%" y="-20%" width="120%" height="160%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="1.6" stdDeviation="0" style="flood-color:#fffdf5;flood-opacity:.9"/></filter>
<filter id="a-blur" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>

<ellipse cx="200" cy="330" rx="118" ry="14" fill="rgba(64,54,25,.2)" opacity=".55" filter="url(#a-blur)"/>
